<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e6eef1">
  <meta name="description" content="Acceso rápido a la Guía UCIP y a la calculadora de dosis.">
  <title>Recursos clínicos</title>
  <link rel="icon" type="image/png" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --page: #e6eef1;
      --surface: #f9fcfd;
      --ink: #21485b;
      --muted: #657d88;
      --button: #315f75;
      --button-hover: #244e64;
      --aqua: #2cc9c1;
      --ring: #22a9ab;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% -14%, rgba(255,255,255,.92), transparent 65%),
        var(--page);
      color: var(--ink);
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 42px 20px;
    }

    .card {
      width: min(100%, 480px);
      padding: clamp(28px, 6.2vw, 44px);
      border: 1px solid rgba(255,255,255,.86);
      border-radius: 28px;
      background: rgba(249, 252, 253, .82);
      box-shadow: 0 20px 55px rgba(37,73,89,.065), 0 2px 10px rgba(37,73,89,.03);
    }

    .profile { text-align: center; }

    .logo {
      display: block;
      width: 99px;
      height: auto;
      margin: 0 auto 23px;
      object-fit: contain;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-size: clamp(27px, 5vw, 32px);
      font-weight: 700;
      letter-spacing: -.055em;
      line-height: 1.15;
    }

    .subtitle {
      max-width: 310px;
      margin: 13px auto 0;
      color: var(--muted);
      font-size: 14.5px;
      font-weight: 400;
      line-height: 1.65;
      letter-spacing: -.01em;
    }

    .separator {
      width: 35px;
      height: 3px;
      margin: 27px auto 30px;
      border: 0;
      border-radius: 10px;
      background: var(--aqua);
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .link {
      display: flex;
      align-items: center;
      gap: 15px;
      width: 100%;
      min-height: 78px;
      padding: 14px 16px;
      border: 1px solid rgba(18,55,74,.12);
      border-radius: 15px;
      background: var(--button);
      color: #fff;
      text-decoration: none;
      text-align: left;
      box-shadow: 0 3px 8px rgba(24,63,82,.075);
      transition: background-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }

    .link:hover {
      background: var(--button-hover);
      transform: translateY(-2px);
      box-shadow: 0 8px 17px rgba(24,63,82,.14);
    }

    .link:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 4px;
    }

    .link__icon {
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(255,255,255,.12);
    }

    .link__icon svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .link__content {
      display: grid;
      gap: 3px;
      flex: 1;
      min-width: 0;
    }

    .link__title {
      font-size: 15.5px;
      font-weight: 700;
      letter-spacing: -.025em;
      line-height: 1.3;
    }

    .link__detail {
      color: rgba(255,255,255,.76);
      font-size: 12.5px;
      font-weight: 400;
      line-height: 1.4;
    }

    .link__arrow {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      opacity: .85;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .footnote {
      margin: 25px 0 0;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.6;
      text-align: center;
    }

    @media (max-width: 480px) {
      .page { padding: 30px 15px; }
      .card { border-radius: 23px; padding: 31px 23px 26px; }
      .logo { width: 90px; margin-bottom: 21px; }
      .separator { margin: 24px auto 27px; }
      .link { min-height: 75px; padding: 12px 13px; gap: 12px; }
      .link__icon { width: 42px; height: 42px; flex-basis: 42px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .link { transition: none; }
      .link:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="card">
      <header class="profile">
        <img class="logo" src="images/logo.png" alt="Logotipo de dos manos en color turquesa" width="99" height="114" fetchpriority="high">
        <h1>Recursos clínicos</h1>
        <p class="subtitle">Guías y herramientas de consulta rápida</p>
      </header>

      <hr class="separator" aria-hidden="true">

      <nav class="links" aria-label="Herramientas clínicas">
        <a class="link" href="https://scanmar2.github.io/guia_ucip/" target="_blank" rel="noopener noreferrer">
          <span class="link__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 6v15M3 18V5a2 2 0 0 1 2-2h3a4 4 0 0 1 4 4v14a4 4 0 0 0-4-4H5a2 2 0 0 0-2 2zm18 0V5a2 2 0 0 0-2-2h-3a4 4 0 0 0-4 4v14a4 4 0 0 1 4-4h3a2 2 0 0 1 2 2z"/></svg>
          </span>
          <span class="link__content"><span class="link__title">Guía UCIP</span><span class="link__detail">Guía de consulta</span></span>
          <svg class="link__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>

        <a class="link" href="https://scanmar2.github.io/calculadora_dosis/" target="_blank" rel="noopener noreferrer">
          <span class="link__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 10h2m4 0h2M8 14h2m4 0h2M8 18h2m4 0h2"/></svg>
          </span>
          <span class="link__content"><span class="link__title">Calculadora de dosis</span><span class="link__detail">Herramienta de cálculo</span></span>
          <svg class="link__arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </a>
      </nav>

      <p class="footnote">Herramientas de apoyo. Verifica siempre la información antes de utilizarla en la práctica clínica.</p>
    </main>
  </div>
</body>
</html>
